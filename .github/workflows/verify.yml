name: Verify Zytrex sandbox
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zytrex
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: zytrex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U zytrex -d zytrex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://zytrex:ci-only-password@localhost:5432/zytrex_test
      - run: npm run test:persistence
        env:
          DATABASE_URL: postgres://zytrex:ci-only-password@localhost:5432/zytrex_test
          ZYTREX_TEST_DATABASE: '1'
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start app and check desktop/mobile workflows
        env:
          DATABASE_URL: postgres://zytrex:ci-only-password@localhost:5432/zytrex_test
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/zytrex.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/login >/dev/null && break; sleep 1; done
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zytrex-ui-evidence
          path: artifacts/
